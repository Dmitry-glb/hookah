<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DimHookah">
    <title>DimHookah Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <audio id="bg-audio" loop playsinline></audio>

    <div class="app-header">
        <h2 style="margin:0; font-size: 1.3em;">💨 DimHookah</h2>
    </div>

    <!-- Основная панель сессии -->
    <div class="glass-panel">
        <h3 id="status-title"
            style="color: var(--text-secondary); text-align: center; font-size: 0.85em; text-transform: uppercase; margin-bottom: 6px;">
            Новая сессия</h3>
        <div class="timer-display" id="timer">00:00</div>

        <!-- Шаг 1: Заполнение чаши -->
        <div id="setup-form">
            <div class="form-group">
                <label>Чаша</label>
                <div class="select-with-add">
                    <select id="bowl-select"></select>
                    <button type="button" class="btn-plus" onclick="addNewBowlPrompt()" title="Добавить чашу">+</button>
                </div>
            </div>

            <!-- Блок табака (Соло / Микс) -->
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin:0;">Табак</label>
                    <button type="button" class="pill-btn" id="mix-toggle-btn" onclick="toggleMixMode()"
                        style="font-size: 0.75em; padding: 4px 10px;">Режим: Соло</button>
                </div>

                <!-- Соло забивка -->
                <div id="solo-container" class="tobacco-entry-card">
                    <div class="select-with-add" style="margin-bottom: 8px;">
                        <select id="solo-tobacco-brand"></select>
                        <button type="button" class="btn-plus" onclick="addNewBrandPrompt('solo-tobacco-brand')"
                            title="Добавить бренд">+</button>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="solo-tobacco-flavor" placeholder="Вкус" style="flex: 2;">
                        <input type="number" id="solo-tobacco-weight" placeholder="Грамм" style="flex: 1;">
                    </div>
                </div>

                <!-- Мульти-микс забивка -->
                <div id="mix-container" class="hidden"></div>
                <button type="button" id="add-mix-btn" class="btn btn-secondary hidden" onclick="addMixRow()"
                    style="padding: 10px; font-size: 0.85em; margin-top: 6px;">+ Добавить табак в микс</button>
            </div>

            <!-- Время прогрева (Крутилки iOS: Минуты 5-20 и Секунды) -->
            <div class="form-group">
                <label>Время прогрева чаши</label>
                <div class="wheel-picker-box">
                    <div class="wheel-col">
                        <select id="warmup-min"></select>
                        <span>мин</span>
                    </div>
                    <div class="wheel-sep">:</div>
                    <div class="wheel-col">
                        <select id="warmup-sec"></select>
                        <span>сек</span>
                    </div>
                </div>
            </div>

            <button class="btn" onclick="startWarmupSession()">🚀 Начать прогрев чаши</button>
        </div>

        <!-- Шаг 2: Прогрев чаши -->
        <div id="warmup-controls" class="hidden">
            <div class="sub-timer-box" id="warmup-box">
                <div style="font-size: 0.85em; color: var(--text-secondary);">Прогрев чаши:</div>
                <div class="sub-timer-display" id="warmup-countdown">05:00</div>
            </div>
            <button class="btn btn-success" onclick="startSmokingFromWarmup()">💨 Чаша прогрета — Начать покур!</button>
        </div>

        <!-- Шаг 3: Покур -->
        <div id="smoking-controls" class="hidden">
            <div class="sub-timer-box">
                <div style="font-size: 0.85em; color: var(--text-secondary); margin-bottom: 6px;">Текущая расстановка
                    углей:</div>
                <div class="coal-setup-selector">
                    <div class="coal-chip" id="chip-3" onclick="setCoalPlacement('3 в колодке')">3 в кол.</div>
                    <div class="coal-chip" id="chip-21" onclick="setCoalPlacement('2 + 1')">2 + 1</div>
                    <div class="coal-chip" id="chip-pyr" onclick="setCoalPlacement('Пирамида')">Пирамида</div>
                </div>
            </div>
            <button class="btn btn-danger" style="width: 100%; padding: 15px; font-size: 1em;"
                onclick="finishSmokingSession()">🏁 Завершить покур</button>
        </div>

        <!-- Шаг 4: Оценка -->
        <div id="rating-form" class="hidden">
            <h3 style="text-align: center; margin-bottom: 8px;">Оцените покур</h3>
            <div class="stars">
                <span class="star" onclick="setRating(1)">★</span>
                <span class="star" onclick="setRating(2)">★</span>
                <span class="star" onclick="setRating(3)">★</span>
                <span class="star" onclick="setRating(4)">★</span>
                <span class="star" onclick="setRating(5)">★</span>
            </div>
            <div class="form-group">
                <label>Комментарий</label>
                <textarea id="comment" rows="2" placeholder="Как вкус, жар..."></textarea>
            </div>
            <button class="btn" onclick="saveSession()">💾 Сохранить в историю</button>
        </div>
    </div>

    <!-- Рейтинг табаков -->
    <div class="glass-panel">
        <h3>🏆 Рейтинг табаков</h3>
        <div id="analytics-content" style="overflow-x: auto;">Нет данных</div>
    </div>

    <!-- История -->
    <div class="glass-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin:0;">📅 История</h3>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;">
                <button class="pill-btn" onclick="exportToNotes()">📋 Заметки</button>
                <button class="pill-btn" onclick="exportToCSV()">📊 Экспорт</button>
                <button class="pill-btn" onclick="document.getElementById('csv-file-input').click()"
                    style="background: rgba(10,132,255,0.25); border-color: var(--info);">📂 Импорт</button>
                <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importFromCSV(event)">
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Сетап</th>
                        <th>Микс</th>
                        <th>Время</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="edit-modal" class="hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">✏️ Редактирование покура</h3>
            <input type="hidden" id="modal-id">

            <div class="form-group">
                <label>Дата</label>
                <input type="text" id="modal-date">
            </div>

            <div class="form-group">
                <label style="text-align: center;">Оценка</label>
                <div class="stars" id="modal-stars" style="margin: 4px 0 8px; font-size: 2em;">
                    <span class="modal-star" onclick="setModalRating(1)">★</span>
                    <span class="modal-star" onclick="setModalRating(2)">★</span>
                    <span class="modal-star" onclick="setModalRating(3)">★</span>
                    <span class="modal-star" onclick="setModalRating(4)">★</span>
                    <span class="modal-star" onclick="setModalRating(5)">★</span>
                </div>
            </div>

            <div class="form-group">
                <label>Чаша</label>
                <div class="select-with-add">
                    <select id="modal-bowl"></select>
                    <button type="button" class="btn-plus" onclick="addNewBowlPrompt('modal-bowl')">+</button>
                </div>
            </div>

            <div class="form-group">
                <label>Расстановка</label>
                <select id="modal-placement">
                    <option value="3 в колодке">3 в колодке</option>
                    <option value="2 + 1">2 + 1</option>
                    <option value="Пирамида">Пирамида</option>
                </select>
            </div>

            <div class="form-group">
                <label>Табак в забивке</label>
                <div id="modal-mix-container"></div>
                <button type="button" class="btn btn-secondary" onclick="addModalMixRow()"
                    style="padding: 8px; font-size: 0.8em; margin-top: 4px; margin-bottom: 0;">+ Добавить табак</button>
            </div>

            <div class="form-group">
                <label>Время прогрева (Часы и Минуты)</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="number" id="modal-warmup-h" min="0" placeholder="Час" style="text-align: center;">
                    <span>ч</span>
                    <input type="number" id="modal-warmup-m" min="0" max="59" placeholder="Мин"
                        style="text-align: center;">
                    <span>мин</span>
                </div>
            </div>

            <div class="form-group">
                <label>Время покура (Часы и Минуты)</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="number" id="modal-smoke-h" min="0" placeholder="Час" style="text-align: center;">
                    <span>ч</span>
                    <input type="number" id="modal-smoke-m" min="0" max="59" placeholder="Мин"
                        style="text-align: center;">
                    <span>мин</span>
                </div>
            </div>

            <div class="form-group">
                <label>Комментарий</label>
                <textarea id="modal-comment" rows="2"></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-secondary" onclick="closeEditModal()" style="margin:0;">Отмена</button>
                <button class="btn" onclick="saveEditedSession()" style="margin:0;">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
