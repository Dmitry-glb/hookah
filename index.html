<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DimHookah">
    <title>Трекер кальянных сессий</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Скрытый аудио-плеер для удержания фонового режима iOS -->
    <audio id="bg-audio" loop playsinline></audio>

    <div class="app-header">
        <h2 style="margin:0; font-size: 1.3em;">💨 DimHookah</h2>
    </div>

    <!-- Основная панель сессии -->
    <div class="glass-panel">
        <h3 id="status-title"
            style="color: var(--text-secondary); text-align: center; font-size: 0.85em; text-transform: uppercase; margin-bottom: 6px;">
            Новая сессия</h3>
        <div class="timer-display" id="timer">00:00</div>

        <!-- Шаг 1: Заполнение чаши (сразу при входе) -->
        <div id="setup-form">
            <div class="form-group">
                <label>Название чаши</label>
                <input type="text" id="bowl" placeholder="CosmoBowl" list="bowls-list">
            </div>

            <!-- Блок табака (Соло / Микс) -->
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin:0;">Табак</label>
                    <button type="button" class="pill-btn" id="mix-toggle-btn" onclick="toggleMixMode()"
                        style="font-size: 0.75em; padding: 4px 10px;">Режим: Соло</button>
                </div>

                <!-- Соло забивка -->
                <div id="solo-container" class="mix-row">
                    <input type="text" id="solo-tobacco-brand" placeholder="Бренд (Darkside)" list="brands-list"
                        style="flex: 1.5;">
                    <input type="text" id="solo-tobacco-flavor" placeholder="Вкус (Supernova)" list="flavors-list"
                        style="flex: 1.8;">
                    <input type="number" id="solo-tobacco-weight" placeholder="Гр" style="flex: 0.9;">
                </div>

                <!-- Мульти-микс забивка (скрыта по умолчанию) -->
                <div id="mix-container" class="hidden">
                    <div class="mix-row">
                        <input type="text" class="tobacco-name" placeholder="Бренд и вкус">
                        <input type="number" class="tobacco-weight" placeholder="Гр">
                        <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">✕</button>
                    </div>
                </div>
                <button type="button" id="add-mix-btn" class="btn btn-secondary hidden" onclick="addMixRow()"
                    style="padding: 10px; font-size: 0.85em; margin-top: 6px;">+ Добавить табак в микс</button>
            </div>

            <!-- Выбор времени прогрева (Минуты и Секунды) -->
            <div class="form-group">
                <label>Время прогрева чаши</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <div style="flex: 1;">
                        <input type="number" id="warmup-min" value="5" min="0" max="60" style="text-align: center;"
                            placeholder="Мин">
                        <span
                            style="font-size: 0.7em; color: var(--text-secondary); display: block; text-align: center; margin-top: 2px;">минут</span>
                    </div>
                    <span style="font-size: 1.2em; font-weight: bold; color: var(--text-secondary);">:</span>
                    <div style="flex: 1;">
                        <input type="number" id="warmup-sec" value="0" min="0" max="59" style="text-align: center;"
                            placeholder="Сек">
                        <span
                            style="font-size: 0.7em; color: var(--text-secondary); display: block; text-align: center; margin-top: 2px;">секунд</span>
                    </div>
                </div>
            </div>

            <button class="btn" onclick="startWarmupSession()">🚀 Начать прогрев чаши</button>
        </div>

        <!-- Шаг 2: Прогрев чаши -->
        <div id="warmup-controls" class="hidden">
            <div class="sub-timer-box" id="warmup-box">
                <div style="font-size: 0.85em; color: var(--text-secondary);">Прогрев чаши под колпаком:</div>
                <div class="sub-timer-display" id="warmup-countdown">05:00</div>
                <div style="font-size: 0.78em; color: var(--text-secondary);">Фоновый режим iOS активен автоматически
                </div>
            </div>
            <button class="btn btn-success" onclick="startSmokingFromWarmup()">💨 Чаша прогрета — Начать покур!</button>
        </div>

        <!-- Шаг 3: Покур и выбор расстановки -->
        <div id="smoking-controls" class="hidden">
            <div class="sub-timer-box">
                <div style="font-size: 0.85em; color: var(--text-secondary); margin-bottom: 6px;">Текущая расстановка
                    углей:</div>
                <div class="coal-setup-selector">
                    <div class="coal-chip" id="chip-3" onclick="setCoalPlacement('3 в колодке')">3 в кол.</div>
                    <div class="coal-chip" id="chip-21" onclick="setCoalPlacement('2 + 1')">2 + 1</div>
                    <div class="coal-chip" id="chip-pyr" onclick="setCoalPlacement('Пирамида')">Пирамида</div>
                </div>
            </div>
            <button class="btn btn-danger" onclick="finishSmokingSession()">🏁 Завершить покур</button>
        </div>

        <!-- Шаг 4: Оценка и комментарий -->
        <div id="rating-form" class="hidden">
            <h3 style="text-align: center; margin-bottom: 8px;">Оцените покур</h3>
            <div class="stars">
                <span class="star" onclick="setRating(1)">★</span>
                <span class="star" onclick="setRating(2)">★</span>
                <span class="star" onclick="setRating(3)">★</span>
                <span class="star" onclick="setRating(4)">★</span>
                <span class="star" onclick="setRating(5)">★</span>
            </div>
            <div class="form-group">
                <label>Комментарий</label>
                <textarea id="comment" rows="2" placeholder="Как вкус, жар..."></textarea>
            </div>
            <button class="btn" onclick="saveSession()">💾 Сохранить в историю</button>
        </div>
    </div>

    <!-- Рейтинг табаков -->
    <div class="glass-panel">
        <h3>🏆 Рейтинг табаков</h3>
        <div id="analytics-content" style="overflow-x: auto;">Нет данных</div>
    </div>

    <!-- История покуров -->
    <div class="glass-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="margin:0;">📅 История</h3>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;">
                <button class="pill-btn" onclick="exportToNotes()">📋 Заметки</button>
                <button class="pill-btn" onclick="exportToCSV()">📊 Экспорт</button>
                <button class="pill-btn" onclick="document.getElementById('csv-file-input').click()"
                    style="background: rgba(10,132,255,0.25); border-color: var(--info);">📂 Импорт</button>
                <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importFromCSV(event)">
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Сетап</th>
                        <th>Микс</th>
                        <th>Время</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="edit-modal" class="hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">✏️ Редактирование покура</h3>
            <input type="hidden" id="modal-id">

            <div class="form-group">
                <label>Дата</label>
                <input type="text" id="modal-date">
            </div>
            <div class="form-group">
                <label>Чаша</label>
                <input type="text" id="modal-bowl">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Прогрев (сек)</label>
                    <input type="number" id="modal-warmup">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Покур (сек)</label>
                    <input type="number" id="modal-smoke">
                </div>
            </div>
            <div class="form-group">
                <label>Расстановка</label>
                <input type="text" id="modal-placement">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Оценка (1-5)</label>
                    <input type="number" id="modal-rating" min="1" max="5">
                </div>
            </div>
            <div class="form-group">
                <label>Комментарий</label>
                <textarea id="modal-comment" rows="2"></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-secondary" onclick="closeEditModal()" style="margin:0;">Отмена</button>
                <button class="btn" onclick="saveEditedSession()" style="margin:0;">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <!-- Списки автозаполнения из истории (Чаши, Бренды, Вкусы) -->
    <datalist id="bowls-list"></datalist>
    <datalist id="brands-list"></datalist>
    <datalist id="flavors-list"></datalist>
</body>

</html>
